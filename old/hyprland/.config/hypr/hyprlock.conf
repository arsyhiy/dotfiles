# ─────────────────────────────
# BACKGROUND
# ─────────────────────────────

background {
    monitor =
    path = ~/.config/hypr/hyprlock.png

    blur_passes = 2
    contrast = 0.9
    brightness = 0.82
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ─────────────────────────────
# GENERAL
# ─────────────────────────────

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# ─────────────────────────────
# PASSWORD
# ─────────────────────────────

input-field {
    monitor =

    size = 250, 60
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(15, 23, 42, 0.75)
    font_color = rgb(220, 230, 240)

    fade_on_empty = false
    hide_input = false

    font_family = Gabarito Bold
    placeholder_text = <i><span foreground="##7dd3fc99">Hi, $USER</span></i>

    position = 0, -290
    halign = center
    valign = center
}

# ─────────────────────────────
# HOURS
# ─────────────────────────────

label {
    monitor =

    text = cmd[update:1000] echo -e "$(date +"%H")"

    color = rgba(125, 211, 252, 0.8)

    font_size = 180
    font_family = Gabarito

    position = 0, 300
    halign = center
    valign = center
}

# ─────────────────────────────
# MINUTES
# ─────────────────────────────

label {
    monitor =

    text = cmd[update:1000] echo -e "$(date +"%M")"

    color = rgba(255, 255, 255, 0.6)

    font_size = 180
    font_family = Gabarito

    position = 0, 75
    halign = center
    valign = center
}

# ─────────────────────────────
# DATE
# ─────────────────────────────

label {
    monitor =

    text = cmd[update:1000] echo "<span color='##ffffff99'>$(date '+%A, ')</span><span color='##7dd3fc'>$(date '+%d %B')</span>"

    font_size = 30
    font_family = Gabarito Bold

    position = 0, -80
    halign = center
    valign = center
}

# ─────────────────────────────
# STATUS
# ─────────────────────────────

label {
    monitor =

    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh

    color = rgba(255, 255, 255, 0.7)

    font_size = 16
    font_family = Gabarito Bold

    position = 0, 60
    halign = center
    valign = bottom
}
