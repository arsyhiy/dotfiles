# ~/.omp/agent/config.yml

# --- Models ---
modelRoles:
  default: anthropic/claude-sonnet-4-5
  smol: openai/gpt-4.1-mini
  slow: anthropic/claude-opus-4-5:high
  vision: google/gemini-3.1-pro-preview
  plan: anthropic/claude-opus-4-5:high

cycleOrder: ["smol", "default", "slow"]

# --- Tools ---
tools:
  approvalMode: write
  approval:
    bash: prompt
    eval: prompt

# --- Editing ---
edit:
  mode: hashline
  fuzzyMatch: true
  fuzzyThreshold: 0.95
  blockAutoGenerated: true

# --- Reading ---
read:
  defaultLimit: 300
  toolResultPreview: false
  summarize:
    enabled: true
    prose: false

# --- Context Promotion ---
contextPromotion:
  enabled: true

# --- Compaction ---
compaction:
  methodOrder: [snapcompact, remote, soft]
  thresholdPercent: 75

# --- Learning ---
autolearn:
  enabled: true
  autoContinue: false
  minToolCalls: 5

# --- Theme ---
theme:
  dark: titanium
  light: light

symbolPreset: unicode
colorBlindMode: false

# --- Status Line ---
statusLine:
  preset: compact
  separator: powerline-thin
  transparent: false
  showHookStatus: true
