# ~/.omp/agent/config.yml

# --- Настройки моделей (Models) ---
# Здесь вы назначаете, какая модель будет использоваться для разных ролей.
modelRoles:
  # Модель по умолчанию для основных задач
  default: anthropic/claude-sonnet-4-5
  # Быстрая и дешевая модель для легких задач (заголовки, память и т.д.)
  smol: openai/gpt-4.1-mini
  # Более мощная модель для сложных рассуждений (может иметь суффикс "thinking")
  slow: anthropic/claude-opus-4-5:high
  # Модель для работы с изображениями
  vision: google/gemini-3.1-pro-preview

# Порядок переключения моделей в сессии (горячие клавиши)
cycleOrder: ["smol", "default", "slow"]

# --- Настройки инструментов (Tools) ---
tools:
  # Режим подтверждения для инструментов записи (write): "always", "write", "never"
  approvalMode: write
  # Точечная настройка подтверждения для конкретных инструментов
  approval:
    bash: prompt # Всегда запрашивать подтверждение для bash команд

# --- Настройки сжатия контекста (Compaction) ---
compaction:
  # Порядок методов сжатия, которые будут пробоваться
  methodOrder: [snapcompact, remote, soft]
  # Порог в процентах, при достижении которого запускается сжатие
  thresholdPercent: 80

# --- Оформление (Theme) ---
theme:
  dark: titanium # Название темы для темного режима
